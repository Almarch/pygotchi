
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaMaGoTcHi</title>
    <link rel="stylesheet" href="www/styles.css">
    <link rel="icon" type="image/png" href="www/img/favicon.png">
</head>
<body>

    <!-- Menu Icon -->
    <div class="menu-icon" onclick="toggleMenu()">
        ☰
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <button class="close-btn" onclick="toggleMenu()">✖</button>
        <br>
        <br>
        <!-- On/Off Switch -->
        <div class="button-container">
            <label id="on-off-switch" class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
            <button class="action-btn", id="AC">A+C</button>
        </div>
        <br>
        <br>

        <!-- File Upload -->
        <div class="file-controls">
            <!-- Flash ROM (Upload) -->
            <label for="rom-upload" class="up-down"><span class="fa-icon fa-icon-cloud-arrow-up" aria-hidden="true"></span>Flash ROM</label>
            <input type="file" id="rom-upload" accept=".bin" hidden>

            <!-- Load CPU  -->
            <label for="cpu-upload" class="up-down"><span class="fa-icon fa-icon-cloud-arrow-up" aria-hidden="true"></span> Load CPU</label>
            <input type="file" id="cpu-upload" accept=".bin" hidden>
        </div>

        <div class="file-controls">
           <!-- Save CPU -->
           <button id="cpu-download" class="up-down"><span class="fa-icon fa-icon-floppy-disk-solid" aria-hidden="true"></span> Save CPU</button>

            <!-- Reset CPU -->
            <button id="cpu-reset" class="up-down"><span class="fa-icon fa-icon-skull-solid" aria-hidden="true"></span> Reset CPU</button>
        </div>
        <br>

        <!-- Volume Control -->
        <div class="file-controls volume-control">
            <div style="display:flex; align-items:center; gap:10px; width:100%">
                <span class="fa-icon fa-icon-volume-solid" aria-hidden="true"></span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>
        <br>

        <!-- Carebot activation -->
        <div class="file-controls">
            <input type="checkbox" id="carebot" />
                <label for="carebot">
                    <span class="fa-icon fa-icon-heart-regular" id="carebot-icon" aria-hidden="true"></span>
                    Automatic care
                </label>
        </div>

        <!-- Github & Swagger -->
        <div class="bottom-right-links">
            <a href="/swagger" class="swagger-link" target="_blank" title="Swagger API">
              <span class="fa-icon fa-icon-code-solid" aria-hidden="true"></span>
            </a>
            <a href="https://github.com/almarch/pygotchi" target="_blank" class="github-link" title="GitHub Repository">
              <span class="fa-icon fa-icon-github-brands-solid" aria-hidden="true"></span>
            </a>
        </div>

    </div>

    <!-- Main Content -->
    <div class="container">

        <div class = "screen-container" id = "to-shake">
            <img id="main-image" src="www/img/p1/background.png">
            <div id="canvas-pixels"></div>
            <img class="tama-icon" id="tama-icon-0-on" src="www/img/p1/icon0.png">
            <img class="tama-icon" id="tama-icon-1-on" src="www/img/p1/icon1.png">
            <img class="tama-icon" id="tama-icon-2-on" src="www/img/p1/icon2.png">
            <img class="tama-icon" id="tama-icon-3-on" src="www/img/p1/icon3.png">
            <img class="tama-icon" id="tama-icon-4-on" src="www/img/p1/icon4.png">
            <img class="tama-icon" id="tama-icon-5-on" src="www/img/p1/icon5.png">
            <img class="tama-icon" id="tama-icon-6-on" src="www/img/p1/icon6.png">
            <img class="tama-icon" id="tama-icon-7-on" src="www/img/p1/icon7.png">

            <img class="tama-icon" id="tama-icon-0-off" src="www/img/p1/icon0.png">
            <img class="tama-icon" id="tama-icon-1-off" src="www/img/p1/icon1.png">
            <img class="tama-icon" id="tama-icon-2-off" src="www/img/p1/icon2.png">
            <img class="tama-icon" id="tama-icon-3-off" src="www/img/p1/icon3.png">
            <img class="tama-icon" id="tama-icon-4-off" src="www/img/p1/icon4.png">
            <img class="tama-icon" id="tama-icon-5-off" src="www/img/p1/icon5.png">
            <img class="tama-icon" id="tama-icon-6-off" src="www/img/p1/icon6.png">
            <img class="tama-icon" id="tama-icon-7-off" src="www/img/p1/icon7.png">
        </div>

        <div class="button-container">
            <button class="action-btn", id="A"></button>
            <button class="action-btn", id="B"></button>
            <button class="action-btn", id="C"></button>
        </div>
    </div>

    <script src="www/script.js"></script>
</body>
</html>
