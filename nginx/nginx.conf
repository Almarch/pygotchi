worker_processes 1;

events {
    worker_connections 1024;
}

http {

    resolver 127.0.0.11 ipv6=off;

    lua_package_path "/usr/local/openresty/lualib/?.lua;;";
    lua_shared_dict discovery 1m;
    lua_shared_dict jwks 1m;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Redirection globale vers HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS main server ---
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/ssl/ssl.crt;
        ssl_certificate_key /etc/nginx/ssl/ssl.key;

        more_clear_input_headers 'X-User-Sub';

        location /keycloak/ {
            proxy_pass https://keycloak:8443/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location /admin/ {
            proxy_pass https://keycloak:8443/admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location /realms/ {
            proxy_pass https://keycloak:8443/realms/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location /resources/ {
            proxy_pass https://keycloak:8443/resources/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            access_by_lua_block {
                local opts = {
                    redirect_uri_path = "/redirect_uri",
                    discovery = "https://127.0.0.1/realms/game/.well-known/openid-configuration",
                    client_id = "game_client",
                    client_secret = "your_client_secret",
                    redirect_uri_scheme = "https",
                    ssl_verify = "no"
                }
                local res, err = require("resty.openidc").authenticate(opts)
                if err then
                    ngx.status = 403
                    ngx.say(err)
                    ngx.exit(ngx.HTTP_FORBIDDEN)
                end
                
                local id = res.id_token or {}
                ngx.req.set_header("X-User-Sub", id.sub or "")
            }
            
            proxy_pass http://tamagotchi:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
