[build-system]
requires = [
    "setuptools",
    "wheel",
    "pybind11",
]
build-backend = "setuptools.build_meta"

[project]
name = "pygotchi"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "pybind11",
    "thread6",
    "fastapi",
    "uvicorn",
    "starlette==0.37.2",
    "jinja2==3.1.3",
    "asyncio",
    "python-multipart",
    "websockets",
    "numpy"
]

