[build-system]
requires = [
    "setuptools",
    "wheel",
    "pybind11",
]
build-backend = "setuptools.build_meta"

[project]
name = "pygotchi"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "thread6",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "websockets",
    "numpy"
]

[tool.setuptools.package-data]
pygotchi = ["sha.json", "www/**/*"]

